name: Build and Deploy iOS Game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Build Folder
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp index.html www/
          # optional extras — ignored if the game is a single file
          cp -r assets www/ 2>/dev/null || true
          cp *.js    www/ 2>/dev/null || true
          cp *.css   www/ 2>/dev/null || true
          echo "--- www contents ---"
          ls -la www

      # Ryonic Link: a tiny native plugin that lets all Ryonic Inc. apps share progress live
      # through the App Group "group.com.ryonic.shared" (a private storage box only your apps can open).
      - name: Create Ryonic Link plugin
        run: |
          set -e
          mkdir -p ryonic-link
          cat > ryonic-link/package.json <<'EOF'
          {"name":"ryonic-link","version":"1.0.0","main":"index.js","license":"MIT","capacitor":{"ios":{"src":"."}}}
          EOF
          echo "module.exports = {};" > ryonic-link/index.js
          cat > ryonic-link/RyonicLink.podspec <<'EOF'
          Pod::Spec.new do |s|
            s.name = 'RyonicLink'
            s.version = '1.0.0'
            s.summary = 'Shares game progress between Ryonic Inc. apps through an App Group.'
            s.license = 'MIT'
            s.homepage = 'https://github.com/ryansacr7-dot/Ryonic'
            s.author = 'Ryan'
            s.source = { :git => 'https://github.com/ryansacr7-dot/Ryonic.git', :tag => s.version.to_s }
            s.source_files = '*.{swift,h,m}'
            s.ios.deployment_target = '13.0'
            s.dependency 'Capacitor'
            s.swift_version = '5.1'
          end
          EOF
          cat > ryonic-link/RyonicLinkPlugin.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Capacitor/Capacitor.h>
          CAP_PLUGIN(RyonicLinkPlugin, "RyonicLink",
              CAP_PLUGIN_METHOD(write, CAPPluginReturnPromise);
              CAP_PLUGIN_METHOD(read, CAPPluginReturnPromise);
          )
          EOF
          cat > ryonic-link/RyonicLinkPlugin.swift <<'EOF'
          import Foundation
          import Capacitor

          /// write: saves this game's stats (a JSON string) into the shared App Group.
          /// read:  returns the stats every Ryonic Inc. game has saved there.
          @objc(RyonicLinkPlugin)
          public class RyonicLinkPlugin: CAPPlugin {
              private let shared = UserDefaults(suiteName: "group.com.ryonic.shared")

              @objc func write(_ call: CAPPluginCall) {
                  guard let key = call.getString("key"), let value = call.getString("value") else { call.reject("key and value are needed"); return }
                  guard let box = shared else { call.reject("App Group not available"); return }
                  box.set(value, forKey: "ryonic." + key)
                  call.resolve()
              }

              @objc func read(_ call: CAPPluginCall) {
                  guard let box = shared else { call.reject("App Group not available"); return }
                  let keys = call.getArray("keys", String.self) ?? []
                  var values: [String: Any] = [:]
                  for key in keys { if let v = box.string(forKey: "ryonic." + key) { values[key] = v } }
                  call.resolve(["values": values])
              }
          }
          EOF
          ls -la ryonic-link

      - name: Install Mobile Environment Wrapper
        run: |
          set -e
          npm init -y
          npm install ./ryonic-link
          # local-notifications powers the in-game reminders;
          # capacitor-game-connect powers the Game Center leaderboards.
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5 @capacitor/local-notifications@5 @openforge/capacitor-game-connect@5.0.2
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Signals Run" "com.ryan.signalrun" --web-dir=www
          fi
          npx cap add ios
          npx cap sync ios

      # Bakes your own app icon into the build. Must run AFTER "npx cap add ios",
      # because that step regenerates the whole iOS project and would wipe it.
      # Uses sips, which is built into macOS — no npm install, nothing to break.
      - name: Apply App Icon
        run: |
          set -e
          SRC="resources/icon.png"
          if [ ! -f "$SRC" ]; then
            echo "!!  $SRC not found — keeping the default icon."
            echo "    Commit a 1024x1024 PNG (no transparency) to that path."
            exit 0
          fi

          DIM=$(sips -g pixelWidth -g pixelHeight "$SRC" | awk '/pixel/{print $2}' | paste -sd'x' -)
          echo "Source icon: $DIM"
          if [ "$DIM" != "1024x1024" ]; then
            echo "!!  Icon must be exactly 1024x1024. Got $DIM."
            exit 1
          fi
          if sips -g hasAlpha "$SRC" | grep -q "hasAlpha: yes"; then
            echo "    Icon has an alpha channel — flattening it, Apple rejects alpha."
            sips -s format png --deleteColorManagementProperties "$SRC" --out "$RUNNER_TEMP/flat.png" >/dev/null
            SRC="$RUNNER_TEMP/flat.png"
          fi

          SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$SET"; mkdir -p "$SET"

          gen () { sips -z "$1" "$1" "$SRC" --out "$SET/$2" >/dev/null; }
          for S in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            gen $S "icon-${S}.png"
          done

          cat > "$SET/Contents.json" <<'JSON'
          {
            "images": [
              { "size": "20x20",     "idiom": "iphone",       "filename": "icon-40.png",   "scale": "2x" },
              { "size": "20x20",     "idiom": "iphone",       "filename": "icon-60.png",   "scale": "3x" },
              { "size": "29x29",     "idiom": "iphone",       "filename": "icon-58.png",   "scale": "2x" },
              { "size": "29x29",     "idiom": "iphone",       "filename": "icon-87.png",   "scale": "3x" },
              { "size": "40x40",     "idiom": "iphone",       "filename": "icon-80.png",   "scale": "2x" },
              { "size": "40x40",     "idiom": "iphone",       "filename": "icon-120.png",  "scale": "3x" },
              { "size": "60x60",     "idiom": "iphone",       "filename": "icon-120.png",  "scale": "2x" },
              { "size": "60x60",     "idiom": "iphone",       "filename": "icon-180.png",  "scale": "3x" },
              { "size": "20x20",     "idiom": "ipad",         "filename": "icon-20.png",   "scale": "1x" },
              { "size": "20x20",     "idiom": "ipad",         "filename": "icon-40.png",   "scale": "2x" },
              { "size": "29x29",     "idiom": "ipad",         "filename": "icon-29.png",   "scale": "1x" },
              { "size": "29x29",     "idiom": "ipad",         "filename": "icon-58.png",   "scale": "2x" },
              { "size": "40x40",     "idiom": "ipad",         "filename": "icon-40.png",   "scale": "1x" },
              { "size": "40x40",     "idiom": "ipad",         "filename": "icon-80.png",   "scale": "2x" },
              { "size": "76x76",     "idiom": "ipad",         "filename": "icon-76.png",   "scale": "1x" },
              { "size": "76x76",     "idiom": "ipad",         "filename": "icon-152.png",  "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad",         "filename": "icon-167.png",  "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing","filename": "icon-1024.png", "scale": "1x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          JSON

          echo "--- icon set written ---"
          ls -la "$SET"

      # A build number Apple has not seen before. Every upload needs a unique one,
      # and the run number gives you that for free.
      - name: Set Version and Build Number
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          # the game uses no encryption beyond standard HTTPS
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "Build number: ${{ github.run_number }}"

      # Lets Ryonic open this game directly (Play button in Ryonic)
      - name: Register URL scheme for Ryonic
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string signalrun" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string signalrun" "$PLIST"

      - name: Write App Store Connect API Key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          # printf, not echo — echo mangles the newlines inside a .p8 and the key then fails to parse
          printf '%s\n' "$API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          head -1 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      # Archive WITHOUT signing. With automatic signing, xcodebuild tries to make a
      # *development* profile first, and a development profile needs a registered
      # device — which a cloud runner does not have. Signing happens at export instead,
      # where the App Store profile needs no devices at all.
      # Asks Apple what this key can actually do, so we stop guessing.
      # Never fails the build — it is purely a report.
      - name: Check what the API key can do
        continue-on-error: true
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          npm install jsonwebtoken@9 --no-save --silent
          node <<'JS'
          const jwt = require('jsonwebtoken');
          const key = process.env.API_KEY_CONTENT;
          if(!key || !key.includes('BEGIN PRIVATE KEY')){
            console.log('XX  The .p8 secret is empty or malformed.');
            console.log('    It must include the BEGIN PRIVATE KEY and END PRIVATE KEY lines.');
            process.exit(0);
          }
          const token = jwt.sign({}, key, {
            algorithm: 'ES256', expiresIn: '10m',
            issuer: process.env.API_ISSUER_ID,
            audience: 'appstoreconnect-v1',
            header: { alg:'ES256', kid: process.env.API_KEY_ID, typ:'JWT' }
          });
          const H = { Authorization: 'Bearer ' + token };
          const base = 'https://api.appstoreconnect.apple.com/v1/';
          (async () => {
            // 1. is the key valid at all?
            let r = await fetch(base + 'apps?limit=1', { headers: H });
            console.log(r.ok ? 'OK  Key is valid and authenticating.'
                             : 'XX  Key rejected (' + r.status + '). Wrong Key ID, Issuer ID or .p8.');
            if(!r.ok) return;

            // 2. can it see certificates? this is the cloud-signing permission
            r = await fetch(base + 'certificates?limit=200', { headers: H });
            if(r.ok){
              const d = await r.json();
              const dist = d.data.filter(c => /DISTRIBUTION/i.test(c.attributes.certificateType));
              console.log('OK  Key can read certificates. Team has ' + d.data.length +
                          ' total, ' + dist.length + ' distribution.');
              if(dist.length === 0){
                console.log('!!  No distribution certificate exists yet.');
                console.log('    Cloud signing must create one, which needs an ADMIN key.');
              }
            } else {
              console.log('XX  Key CANNOT read certificates (' + r.status + ').');
              console.log('    This is the cloud signing permission error.');
              console.log('    The key role is not Admin. Make a new Team Key with Access = Admin.');
            }

            // 3. does the app record exist in App Store Connect?
            r = await fetch(base + 'apps?filter[bundleId]=com.ryan.signalrun', { headers: H });
            if(r.ok){
              const d = await r.json();
              console.log(d.data.length
                ? 'OK  App record found: ' + d.data[0].attributes.name
                : 'XX  No app record for com.ryan.signalrun. Create it in App Store Connect > My Apps > + > New App.');
            }
          })();
          JS

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$RUNNER_TEMP/SignalsRun.xcarchive" \
                     DEVELOPMENT_TEAM=XL662VBNF4 \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     archive

      # Signing happens here, with the App Store profile
      # The archive above is unsigned, so give it a temporary signature that carries the App Group
      # entitlement; the export step re-signs it for the App Store.
      - name: Add App Group and Game Center entitlements
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP" -maxdepth 4 -path "*.xcarchive/Products/Applications/*.app" -type d | head -1)
          echo "App: $APP"
          cat > "$RUNNER_TEMP/ryonic.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.ryonic.shared</string>
              </array>
              <key>com.apple.developer.game-center</key>
              <true/>
          </dict>
          </plist>
          PLIST
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/ryonic.entitlements" "$APP"
          echo "--- entitlements now in the app ---"
          codesign -d --entitlements - "$APP" 2>/dev/null || codesign -d --entitlements :- "$APP"

      - name: Export IPA (signed for the App Store)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <!-- "app-store" is deprecated; "app-store-connect" is the current name -->
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>XL662VBNF4</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
                     -archivePath "$RUNNER_TEMP/SignalsRun.xcarchive" \
                     -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                     -exportPath "$RUNNER_TEMP/build" \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$API_KEY_ID" \
                     -authenticationKeyIssuerID "$API_ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          echo "--- exported ---"
          ls -la "$RUNNER_TEMP/build"
          IPA=$(find "$RUNNER_TEMP/build" -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      # THIS is what was missing. Without it the build succeeds and nothing
      # ever arrives in TestFlight.
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          # without this TestFlight stalls on "Missing Compliance" and never
          # hands the build to testers
          uses-non-exempt-encryption: false
          # Don't sit polling Apple for processing status. The upload itself is
          # already complete by this point, and the API token expires during the
          # long wait, which turns a successful upload into a red 401.
          wait-for-processing: false

      # So you can download and inspect the build even if the upload is rejected
      - name: Keep the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignalsRun-ipa
          path: ${{ runner.temp }}/build
          if-no-files-found: ignore
